<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Checklist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="action-bar">
      <button
        id="loadCsvBtn"
        type="button"
        class="action-btn"
      >
        Load from CSV
      </button>
      <input
        type="file"
        id="loadCsvInput"
        accept=".csv"
      />
      
       <button
         id="saveBtn"
         class="action-btn"
       >
         Save Checklist as CSV
       </button>

     
      <div id="checklist-counter" class="checklist-counter-inline">
        Progress: <span id="checkedCount">4</span> / <span id="totalCount">0</span> items checked
      </div>
    </div>

    <div id="statusMessage" class="status-message" aria-live="polite" aria-atomic="true"></div>

    <p class="drag-hint">Tip: drag items with your mouse to reorder them between sections.</p>

    <div class="checklist-grid">
      <div class="first-column">
        <div class="section cannot-travel-without-section" data-section-title="CANNOT TRAVEL WITHOUT">
          <div class="section-header">
            <h2>CANNOT TRAVEL WITHOUT</h2>
            <button type="button" id="addItemBtn" class="add-item-btn" aria-label="Add a temporary checklist item">Temporarily Add Another Item</button>
          </div>
          <label><input type="checkbox" /> Photo ID</label>
          <label><input type="checkbox" /> Cell phone</label>
          <label><input type="checkbox" /> Cell phone charger</label>
          <label><input type="checkbox" /> Laptop power cord</label>
          <label><input type="checkbox" /> Mouse</label>
          <label><input type="checkbox" /> Company badge</label>
        </div>

        <div class="section must-have-section" data-section-title="MUST HAVE">
          <div class="section-header">
            <h2>MUST HAVE </h2>
          </div>
          <label><input type="checkbox" /> Blood pressure medicines</label>
          <label><input type="checkbox" /> Eye Pressure Eye Drop</label>
          <label><input type="checkbox" /> Motidom</label>
          <label><input type="checkbox" /> Sleep aid</label>
          <label><input type="checkbox" /> Tylenol</label>
        </div>

      </div>

      <div class="second-column">
        <div class="section fillables-section" data-section-title="FILLABLES">
          <div class="section-header">
            <h2>FILLABLES</h2>
          </div>
          <label><input type="checkbox" /> Tea bags</label>
          <label><input type="checkbox" /> Original iPhone earbuds</label>
          <label><input type="checkbox" /> Cotton swabs (Q-tips)</label>
          <label><input type="checkbox" /> Spare Eye Glasses</label>
          <label><input type="checkbox" /> Toothpaste</label>
          <label><input type="checkbox" /> Hair oil</label>
          <label><input type="checkbox" /> Charge your watch</label>
        </div>

        <div class="section clothing-section" data-section-title="CLOTHING">
          <div class="section-header">
            <h2>CLOTHING</h2>
          </div>
  
          <label><input type="checkbox" /> Belt</label>
          <label><input type="checkbox" /> Salesforce official Shirt</label>
          <label><input type="checkbox" /> Cap for Cold</label>
          <label><input type="checkbox" /> Shoes</label>
          <label><input type="checkbox" /> Shirts</label>
          <label><input type="checkbox" /> Pants</label>
          <label><input type="checkbox" /> Underwear</label>
          <label><input type="checkbox" /> Undershirts</label>
          <label><input type="checkbox" /> Socks</label>
        </div>
      </div>

      <div class="third-column">
        <div class="section" data-section-title="SHOULD HAVE">
          <div class="section-header">
            <h2>SHOULD HAVE</h2>
          </div>
          <label><input type="checkbox" /> Air ticket (printed or digital)</label>
          <label><input type="checkbox" /> Directions / itinerary</label>
          <hr />
          <label><input type="checkbox" /> Water bottle</label>
          <label><input type="checkbox" /> Shorts</label>
          <label><input type="checkbox" /> Light jacket</label>
           <label><input type="checkbox" />Power Bank</label>
           <label><input type="checkbox" /> Power extension cord</label>
        </div>
        <div class="section" data-section-title="CAN HAVE (Optional)">
          <div class="section-header">
            <h2>CAN HAVE (Optional)</h2>
          </div>
          <label><input type="checkbox" /> Electric kettle</label>
          <label><input type="checkbox" /> Dry milk</label>
          <label><input type="checkbox" /> Toothbrush</label>
          <label><input type="checkbox" /> Floss</label>
          <label><input type="checkbox" /> Comb</label>
          <label><input type="checkbox" /> Some cash</label>
          <label><input type="checkbox" /> Chapstick</label>
          <label><input type="checkbox" /> Nail clipper</label>
          <label><input type="checkbox" /> Neha Indian Cuisine</label>
        </div>
      </div>

      <div class="done-column">
  
        <div class="section" id="doneSection" data-section-title="DONE">
          <div class="section-header">
            <h2>DONE</h2>
            <button type="button" class="clear-section-btn" aria-label="Clear all done items">Clear the Section</button>
          </div>
          <!-- checked items will be moved here -->
        </div>
      </div>
    </div>

    <!-- BEGIN_INLINED_SCRIPT: inlined from src/main.js -->
    <script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    let hasUnsavedExport = true;
  let undoStack = [];
  let draggedLabel = null;
  let currentFilter = 'all';

  function getCurrentState() {
    const data = [];
    const sections = document.querySelectorAll('.section');
    sections.forEach(section => {
      const sectionTitle = section.querySelector('h2')?.innerText.trim();
      section.querySelectorAll('label').forEach(label => {
        const checkbox = label.querySelector('input[type="checkbox"]');
        if (!checkbox) return;
        const itemText = label.textContent.trim();
        data.push({
          section: sectionTitle,
          label: itemText,
          checked: checkbox.checked,
          origSection: label.dataset.origSection || sectionTitle,
          lastUpdated: label.dataset.lastUpdated || '',
        });
      });
    });
    return data;
  }

  function applyState(state) {
    if (!Array.isArray(state)) return;
    const allLabels = Array.from(document.querySelectorAll('label'));
    state.forEach(item => {
      const label = allLabels.find(l => normalizeText(l.textContent) === normalizeText(item.label));
      if (!label) return;
      const checkbox = label.querySelector('input[type="checkbox"]');
      if (!checkbox) return;
      checkbox.checked = item.checked;
      label.dataset.origSection = item.origSection || item.section;
      label.dataset.lastUpdated = item.lastUpdated || label.dataset.lastUpdated || '';
    });
    updateItemPlacement();
    saveState();
    updateCounter();
  }

  function setUndoAvailability() {
    // No longer needed since we use floating button
  }

  function showFloatingUndoBtn(checkbox) {
    if (undoStack.length === 0) return;
    
    const label = checkbox.closest('label');
    if (!label) return;

    // Create or reuse floating undo button
    let floatingBtn = document.getElementById('floatingUndoBtn');
    if (!floatingBtn) {
      floatingBtn = document.createElement('button');
      floatingBtn.id = 'floatingUndoBtn';
      floatingBtn.className = 'floating-undo-btn';
      floatingBtn.textContent = 'Undo';
      floatingBtn.addEventListener('click', () => {
        if (undoStack.length === 0) return;
        const stateToRestore = undoStack.pop();
        applyState(stateToRestore);
        showStatus('Undo applied');
        floatingBtn.classList.remove('visible');
        clearTimeout(floatingBtn.timeoutId);
      });
      document.body.appendChild(floatingBtn);
    }

    // Position button at center of screen
    floatingBtn.style.left = '50%';
    floatingBtn.style.top = '50%';
    floatingBtn.style.transform = 'translate(-50%, -50%)';

    // Show button
    floatingBtn.classList.add('visible');

    // Clear existing timeout
    clearTimeout(floatingBtn.timeoutId);

    // Hide after 10 seconds
    floatingBtn.timeoutId = setTimeout(() => {
      floatingBtn.classList.remove('visible');
    }, 10000);
  }

  function setSaveAvailability() {
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.disabled = !hasUnsavedExport;
  }

  function updateCounter() {
    const allCheckboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));
    // Filter out checkboxes in animated clones (labels with position: fixed are animation clones)
    const actualCheckboxes = allCheckboxes.filter(cb => {
      const label = cb.closest('label');
      if (!label) return true; // If not in a label, count it
      const style = window.getComputedStyle(label);
      return style.position !== 'fixed';
    });
    
    const totalCount = actualCheckboxes.length;
    const checkedCount = actualCheckboxes.filter(cb => cb.checked).length;
    
    const checkedCountEl = document.getElementById('checkedCount');
    const totalCountEl = document.getElementById('totalCount');
    
    if (checkedCountEl) checkedCountEl.textContent = checkedCount;
    if (totalCountEl) totalCountEl.textContent = totalCount;
    updateSectionCounters();
  }

  function updateSectionCounters() {
    const sections = Array.from(document.querySelectorAll('.section'));
    const allLabels = Array.from(document.querySelectorAll('.section label'));
    sections.forEach(section => {
      const counter = section.querySelector('.section-counter');
      if (!counter) return;

      const sectionTitle = section.dataset.sectionTitle || section.querySelector('h2')?.innerText.trim() || '';
      const normalizedSectionTitle = normalizeText(sectionTitle);

      // DONE should reflect items currently in DONE.
      if (section.id === 'doneSection') {
        const doneLabels = Array.from(section.querySelectorAll('label'));
        const doneChecked = doneLabels.filter(label => label.querySelector('input[type="checkbox"]')?.checked).length;
        counter.textContent = `${doneChecked}/${doneLabels.length}`;
        return;
      }

      // Other sections should keep stable totals based on the item's original section.
      const sectionItems = allLabels.filter(label => {
        const orig = normalizeText(label.dataset.origSection || '');
        return orig === normalizedSectionTitle;
      });
      const checkedInSection = sectionItems.filter(label => label.querySelector('input[type="checkbox"]')?.checked).length;
      counter.textContent = `${checkedInSection}/${sectionItems.length}`;
    });
  }

  function normalizeText(value) {
    return (value || '').trim().toLowerCase();
  }

  function showStatus(message, isError = false) {
    const statusElement = document.getElementById('statusMessage');
    if (!statusElement) return;
    statusElement.textContent = message;
    statusElement.classList.add('visible');
    statusElement.classList.toggle('error', isError);
    window.clearTimeout(showStatus.timeoutId);
    showStatus.timeoutId = window.setTimeout(() => {
      statusElement.classList.remove('visible');
      statusElement.classList.remove('error');
    }, 2800);
  }

  function snapshotState() {
    undoStack.push(getCurrentState());
    // keep only the last 10 snapshots
    if (undoStack.length > 10) undoStack.shift();
    setUndoAvailability();
  }

  function animateLabel(label) {
    // add the class that triggers the CSS keyframe animation
    label.classList.add('animate-move');
    window.clearTimeout(animateLabel.timeoutId);
    const rootStyle = getComputedStyle(document.documentElement);
    const durationStr = rootStyle.getPropertyValue('--fly-duration') || '900ms';
    const durationMs = parseDurationToMs(durationStr.trim());
    animateLabel.timeoutId = window.setTimeout(() => {
      label.classList.remove('animate-move');
    }, durationMs + 80);
  }

  function animateFly(label, toElement) {
    const rect = label.getBoundingClientRect();
    const targetRect = toElement.getBoundingClientRect();
    const clone = label.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.left = `${rect.left}px`;
    clone.style.top = `${rect.top}px`;
    clone.style.width = `${rect.width}px`;
    clone.style.pointerEvents = 'none';
    clone.style.zIndex = '9999';

    // determine duration from CSS variable (supports 'ms' or 's')
    const rootStyle = getComputedStyle(document.documentElement);
    const durationStr = rootStyle.getPropertyValue('--fly-duration') || '900ms';
    const durationMs = parseDurationToMs(durationStr.trim());
    clone.style.transition = `transform ${durationMs}ms var(--fly-ease, ease), opacity ${durationMs}ms var(--fly-ease, ease)`;
    document.body.appendChild(clone);

    const deltaX = targetRect.left - rect.left;
    const deltaY = targetRect.top - rect.top;

    requestAnimationFrame(() => {
      clone.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      clone.style.opacity = '0.3';
    });

    window.setTimeout(() => {
      if (clone.parentElement) clone.parentElement.removeChild(clone);
    }, durationMs + 120);
  }

  // helper to parse CSS duration string to milliseconds
  function parseDurationToMs(value) {
    if (!value) return 900;
    value = String(value).trim();
    if (value.endsWith('ms')) {
      return parseFloat(value.replace('ms', '')) || 900;
    }
    if (value.endsWith('s')) {
      return (parseFloat(value.replace('s', '')) || 0.9) * 1000;
    }
    // fallback numeric
    const n = parseFloat(value);
    if (Number.isFinite(n)) return n;
    return 900;
  }

  function updateItemPlacement() {
    const doneSection = document.getElementById('doneSection');
    if (!doneSection) return;

    const allLabels = document.querySelectorAll('.section label');
    allLabels.forEach(label => {
      const checkbox = label.querySelector('input[type="checkbox"]');
      if (!checkbox) return;
      const origSection = label.dataset.origSection;
      if (checkbox.checked) {
        if (label.parentElement !== doneSection) {
          animateFly(label, doneSection);
          doneSection.appendChild(label);
          animateLabel(label);
        }
      } else if (origSection) {
        const targetSection = Array.from(document.querySelectorAll('.section')).find(section => section.dataset.sectionTitle === origSection);
        if (targetSection && label.parentElement !== targetSection) {
          animateFly(label, targetSection);
          targetSection.appendChild(label);
          animateLabel(label);
        }
      }
    });
    // ensure drag handlers are attached after items are moved
    enableDragAndDrop();
    // keep DONE section alphabetized
    sortDoneSection();
  }

  function sortDoneSection() {
    const doneSection = document.getElementById('doneSection');
    if (!doneSection) return;
    const labels = Array.from(doneSection.children).filter(n => n.tagName === 'LABEL');
    labels.sort((a, b) => {
      const ta = normalizeText(a.textContent || '');
      const tb = normalizeText(b.textContent || '');
      return ta.localeCompare(tb);
    });
    labels.forEach(l => doneSection.appendChild(l));
  }

  function moveItemOnChange(checkbox) {
    const label = checkbox.closest('label');
    if (!label) return;
    const doneSection = document.getElementById('doneSection');

    if (checkbox.checked && doneSection) {
      if (!label.dataset.origSection && label.parentElement) {
        label.dataset.origSection = label.parentElement.dataset.sectionTitle || '';
      }
      animateFly(label, doneSection);
      doneSection.appendChild(label);
      animateLabel(label);
        sortDoneSection();

    } else if (!checkbox.checked) {
      let origSection = label.dataset.origSection || initialSectionMap.get(normalizeText(label.textContent));
      if (normalizeText(origSection) === 'done') {
        origSection = initialSectionMap.get(normalizeText(label.textContent));
      }
      let targetSection = Array.from(document.querySelectorAll('.section')).find(section => section.dataset.sectionTitle === origSection);

      if (!targetSection && origSection) {
        const normalizedOrig = normalizeText(origSection);
        targetSection = Array.from(document.querySelectorAll('.section')).find(section => normalizeText(section.dataset.sectionTitle) === normalizedOrig);
      }

      if (!targetSection) {
        const itemKey = normalizeText(label.textContent);
        const fallbackSection = initialSectionMap.get(itemKey);
        if (fallbackSection) {
          targetSection = Array.from(document.querySelectorAll('.section')).find(section => normalizeText(section.dataset.sectionTitle) === normalizeText(fallbackSection));
        }
      }

      if (!targetSection) {
        targetSection = document.querySelector('.first-column .section') || document.querySelector('.section');
      }

      if (targetSection) {
        animateFly(label, targetSection);
        targetSection.appendChild(label);
        animateLabel(label);
      }
    }
  }

  function saveState() {
    const stateToSave = [];
    const sections = document.querySelectorAll('.section');
    sections.forEach(section => {
      const sectionTitle = section.querySelector('h2').innerText.trim();
      const labels = section.querySelectorAll('label');
      labels.forEach(label => {
        const checkbox = label.querySelector('input[type="checkbox"]');
        const itemText = label.textContent.trim();
        const checked = checkbox.checked;
        const origSection = label.dataset.origSection || sectionTitle;
        const lastUpdated = label.dataset.lastUpdated || '';
        stateToSave.push({ section: sectionTitle, label: itemText, checked: checked, origSection: origSection, lastUpdated: lastUpdated });
      });
    });
    localStorage.setItem('travelChecklistState', JSON.stringify(stateToSave));
    hasUnsavedExport = true;
    setSaveAvailability();
    showStatus('Saved to localStorage');
  }

  showStatus('Initialization: Travel Checklist ready');
  ensureSectionCounters();
  enableMobileAccordion();
  const initialSectionMap = new Map();
  document.querySelectorAll('.section').forEach(section => {
    const sectionTitle = section.querySelector('h2')?.innerText.trim();
    if (sectionTitle) section.dataset.sectionTitle = sectionTitle;
    section.querySelectorAll('label').forEach(label => {
      const itemKey = normalizeText(label.textContent);
      if (!label.dataset.origSection) label.dataset.origSection = sectionTitle;
      if (!label.dataset.lastUpdated) label.dataset.lastUpdated = new Date().toISOString();
      label.tabIndex = 0;
      if (sectionTitle && itemKey) {
        initialSectionMap.set(itemKey, sectionTitle);
      }
    });
  });

  const savedState = localStorage.getItem('travelChecklistState');
  if (savedState) {
    const state = JSON.parse(savedState);
    state.forEach(item => {
      const targetKey = normalizeText(item.label);
      let label = Array.from(document.querySelectorAll('label')).find(l => normalizeText(l.textContent) === targetKey);
      const checkboxChecked = !!item.checked;

      // determine intended section
      const intendedSectionTitle = item.section || item.origSection || '';

      // find a matching section element by data-section-title or h2 text
      function findSectionByTitle(title) {
        const norm = normalizeText(title || '');
        if (!norm) return null;
        const found = Array.from(document.querySelectorAll('.section')).find(s => normalizeText(s.dataset.sectionTitle || s.querySelector('h2')?.innerText) === norm);
        return found || null;
      }

      let targetSection = findSectionByTitle(intendedSectionTitle);
      if (!targetSection && normalizeText(intendedSectionTitle) === 'done') {
        targetSection = document.getElementById('doneSection');
      }

      // if no label exists in DOM, create it and append to targetSection (or fallback)
      if (!label) {
        // fallback to must-have or first section
        if (!targetSection) targetSection = document.querySelector('.must-have-section') || document.querySelector('.section');
        const newLabel = createLabelForItem(item.label, checkboxChecked);
        // ensure correct origSection metadata
        const origin = item.origSection || item.section || (targetSection.dataset.sectionTitle || targetSection.querySelector('h2')?.innerText || '');
        newLabel.dataset.origSection = origin;
        newLabel.dataset.lastUpdated = item.lastUpdated || new Date().toISOString();
        targetSection.appendChild(newLabel);
        // update maps
        initialSectionMap.set(targetKey, origin);
        label = newLabel;
      } else {
        const checkbox = label.querySelector('input[type="checkbox"]');
        if (checkbox) checkbox.checked = checkboxChecked;
        let origin = item.origSection || item.section;
        if (normalizeText(item.section) === 'done') {
          const initialorigin = initialSectionMap.get(targetKey);
          if (initialorigin) origin = initialorigin;
        }
        label.dataset.origSection = origin;
        if (item.lastUpdated) label.dataset.lastUpdated = item.lastUpdated;
      }
    });

    // ensure drag handlers for any created labels
    enableDragAndDrop();
    updateItemPlacement();
    hasUnsavedExport = false;
    setSaveAvailability();
    showStatus('Loaded from localStorage');
    updateCounter();
  }

  const checkboxes = document.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(checkbox => {
    checkbox.addEventListener('mousedown', () => snapshotState());
    checkbox.addEventListener('change', () => {
      const label = checkbox.closest('label');
      if (label) label.dataset.lastUpdated = new Date().toISOString();
      moveItemOnChange(checkbox);
      saveState();
      updateCounter();
      applyCurrentFilter();
      showFloatingUndoBtn(checkbox);
    });
  });

  // enable drag & drop on labels
  enableDragAndDrop();

  // Add item creation helper
  function createLabelForItem(text, checked = false) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!checked;
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + text));
    label.dataset.origSection = document.querySelector('.cannot-travel-without-section')?.dataset.sectionTitle || 'CANNOT TRAVEL WITHOUT';
    label.dataset.lastUpdated = new Date().toISOString();
    label.tabIndex = 0;

    // checkbox listeners
    input.addEventListener('mousedown', () => snapshotState());
    input.addEventListener('change', () => {
      label.dataset.lastUpdated = new Date().toISOString();
      moveItemOnChange(input);
      saveState();
      updateCounter();
      applyCurrentFilter();
      showFloatingUndoBtn(input);
    });

    // attach drag handlers for the new label
    attachDragHandlers(label);
    return label;
  }

  // Attach Add button handler (adds to must-have)
  const addItemBtn = document.getElementById('addItemBtn');
  if (addItemBtn) {
    addItemBtn.addEventListener('click', () => {
      const text = window.prompt('Enter item name to add:');
      if (!text) return;
      const normalizedItem = normalizeText(text);
      const duplicate = Array.from(document.querySelectorAll('.section label')).find(label => normalizeText(label.textContent) === normalizedItem);
      if (duplicate) {
        showStatus('Item already exists', true);
        return;
      }
      const sectionInput = window.prompt('Enter section: CANNOT TRAVEL WITHOUT, MUST HAVE, FILLABLES, CLOTHING, SHOULD HAVE, CAN HAVE (Optional)', 'CANNOT TRAVEL WITHOUT');
      const targetSectionName = (sectionInput || 'CANNOT TRAVEL WITHOUT').trim();
      const section = Array.from(document.querySelectorAll('.section')).find(s => normalizeText(s.dataset.sectionTitle) === normalizeText(targetSectionName));
      if (!section) return;
      const label = createLabelForItem(text, false);
      label.dataset.origSection = section.dataset.sectionTitle || targetSectionName;
      section.appendChild(label);
      // register in initial map so CSV/load and placement work
      const key = normalizeText(text);
      initialSectionMap.set(key, section.dataset.sectionTitle || targetSectionName);
      enableDragAndDrop();
      saveState();
      updateCounter();
      applyCurrentFilter();
      showStatus('Item added');
      // briefly highlight the section to draw attention
      section.classList.add('highlight-add');
      window.setTimeout(() => section.classList.remove('highlight-add'), 900);
    });
  }

  const clearSectionButtons = document.querySelectorAll('.clear-section-btn');
  clearSectionButtons.forEach(button => {
    button.addEventListener('click', () => {
      snapshotState();
      const section = button.closest('.section');
      if (!section) return;
      const sectionCheckboxes = section.querySelectorAll('input[type="checkbox"]');
      sectionCheckboxes.forEach(cb => {
        cb.checked = false;
        moveItemOnChange(cb);
      });
      saveState();
      updateCounter();
      applyCurrentFilter();
      showStatus('Section cleared');
    });
  });

  const loadCsvBtn = document.getElementById('loadCsvBtn');
  const loadCsvInput = document.getElementById('loadCsvInput');
  if (loadCsvBtn) {
    loadCsvBtn.addEventListener('click', () => {
      if (loadCsvInput) loadCsvInput.click();
      else showStatus('File input not found', true);
    });
  } else {
    console.warn('loadCsvBtn not found');
    showStatus('Load button missing', true);
  }

  setUndoAvailability();
  setSaveAvailability();
  updateCounter();

  // (native beforeunload handler preserved later in file)
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      // use the centralized exporter which either writes to the chosen handle or triggers download
      exportCSV().then(() => {
        hasUnsavedExport = false;
        setSaveAvailability();
        showStatus('Checklist exported to CSV');
      }).catch(err => {
        console.error('Export failed', err);
        showStatus('Export failed', true);
      });
    });
  } else {
    console.warn('saveBtn not found');
  }

 

  const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');
  if (resetDefaultsBtn) {
    resetDefaultsBtn.addEventListener('click', () => {
      const ok = window.confirm('Reset checklist to built-in defaults? This removes custom edits and checkmarks.');
      if (!ok) return;
      localStorage.removeItem('travelChecklistState');
      window.location.reload();
    });
  }

  function setFilter(filterKey) {
    currentFilter = filterKey;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.filter === filterKey);
    });
    applyCurrentFilter();
  }

  function applyCurrentFilter() {
    const sections = Array.from(document.querySelectorAll('.section'));
    sections.forEach(section => {
      const sectionTitle = normalizeText(section.dataset.sectionTitle || '');
      let visibleCount = 0;
      const labels = Array.from(section.querySelectorAll('label'));
      labels.forEach(label => {
        const checkbox = label.querySelector('input[type="checkbox"]');
        if (!checkbox) return;
        let visible = true;
        if (currentFilter === 'unchecked') visible = !checkbox.checked;
        if (currentFilter === 'done') visible = checkbox.checked;
        if (currentFilter === 'must-have') {
          const isMustHaveFamily = ['must have', 'fillables', 'clothing'].includes(sectionTitle);
          visible = isMustHaveFamily;
        }
        label.style.display = visible ? '' : 'none';
        if (visible) visibleCount += 1;
      });
      const header = section.querySelector('.section-header');
      if (header && currentFilter !== 'must-have') {
        section.style.display = '';
      } else if (currentFilter === 'must-have') {
        const isMustHaveFamily = ['must have', 'fillables', 'clothing'].includes(sectionTitle);
        section.style.display = isMustHaveFamily ? '' : 'none';
      }
      if (section.style.display !== 'none' && visibleCount === 0 && currentFilter !== 'all') {
        section.style.display = 'none';
      }
    });
    updateSectionCounters();
  }

  [
    ['showAllBtn', 'all'],
    ['showUncheckedBtn', 'unchecked'],
    ['showDoneBtn', 'done'],
    ['showMustHaveBtn', 'must-have'],
  ].forEach(([id, filter]) => {
    const button = document.getElementById(id);
    if (!button) return;
    button.dataset.filter = filter;
    button.addEventListener('click', () => setFilter(filter));
  });



  if (loadCsvInput) {
    loadCsvInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      snapshotState();

      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        parseAndApplyCSV(text);
        event.target.value = '';
      };
      reader.readAsText(file);
    });
  } else {
    console.warn('loadCsvInput not found');
  }


  function parseAndApplyCSV(csvText) {
    const lines = csvText.trim().split('\n');
    if (lines.length < 2) {
      showStatus('CSV file seems empty', true);
      return;
    }

    const headers = lines[0].split(',').map(h => normalizeText(h.replace(/^"|"$/g, '')));
    const sectionIdx = headers.indexOf('section');
    const itemIdx = headers.indexOf('item');
    const checkedIdx = headers.indexOf('checked');
    const origSectionIdx = headers.indexOf('original section');
    const updatedIdx = headers.indexOf('last updated');
    if (sectionIdx === -1 || itemIdx === -1 || checkedIdx === -1) {
      showStatus('CSV file has invalid header. Expected Section, Item, Checked.', true);
      return;
    }

    const stateMap = new Map();
    for (let i = 1; i < lines.length; i++) {
      const row = splitCSVLine(lines[i]);
      if (row.length < headers.length) continue;
      const section = row[sectionIdx].trim();
      const item = row[itemIdx].trim();
      const checked = row[checkedIdx].trim().toLowerCase() === 'yes';
      const origSection = origSectionIdx > -1 ? row[origSectionIdx].trim() : section;
      const lastUpdated = updatedIdx > -1 ? row[updatedIdx].trim() : '';
      const itemKey = normalizeText(item);
      if (!stateMap.has(section)) stateMap.set(section, new Map());
      stateMap.get(section).set(itemKey, { checked, section, origSection, lastUpdated });
    }

    const allLabels = Array.from(document.querySelectorAll('label'));
    allLabels.forEach(label => {
      const itemText = label.textContent.trim();
      const checkKey = normalizeText(itemText);
      const checkbox = label.querySelector('input[type="checkbox"]');
      if (!checkbox) return;

      let matched = null;
      for (const [section, map] of stateMap.entries()) {
        if (map.has(checkKey)) {
          matched = { section, data: map.get(checkKey) };
          break;
        }
      }
      if (matched) {
        checkbox.checked = matched.data.checked;
        if (matched.section !== 'DONE') {
          label.dataset.origSection = matched.data.origSection || matched.section;
        }
        if (matched.data.lastUpdated) label.dataset.lastUpdated = matched.data.lastUpdated;
      }
    });

    updateItemPlacement();
    saveState();
    showStatus('CSV loaded successfully');
    updateCounter();
  }

  // Build CSV content from current DOM
  function buildCSVContent() {
    const rows = [];
    const sections = document.querySelectorAll('.section');
    sections.forEach(section => {
      const sectionTitle = section.querySelector('h2').innerText.trim();
      const labels = section.querySelectorAll('label');
      labels.forEach(label => {
        const checkbox = label.querySelector('input[type="checkbox"]');
        const itemText = label.textContent.trim();
        const checked = checkbox && checkbox.checked;
        const origSection = label.dataset.origSection || sectionTitle;
        const lastUpdated = label.dataset.lastUpdated || '';
        rows.push([sectionTitle, itemText, checked ? 'Yes' : 'No', origSection, lastUpdated]);
      });
    });

    let csvContent = 'Section,Item,Checked,Original Section,Last Updated\n';
    rows.forEach(row => {
      const escapedRow = row.map(field => '"' + String(field).replace(/"/g, '""') + '"');
      csvContent += escapedRow.join(',') + '\n';
    });
    return csvContent;
  }

  // Export CSV: trigger download
  async function exportCSV() {
    const csvContent = buildCSVContent();
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'travel_checklist.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }



  function splitCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"' && (i === 0 || line[i - 1] !== '\\')) {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
    return result;
  }

  setUndoAvailability();
  setSaveAvailability();
  updateCounter();
  applyCurrentFilter();

  // (native beforeunload handler preserved later in file)

  // wire up banner actions
  const saveNowBtn = document.getElementById('saveNowBtn');
  const dismissSaveBtn = document.getElementById('dismissSaveBtn');
  if (saveNowBtn) {
    saveNowBtn.addEventListener('click', () => {
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.click();
      hasUnsavedExport = false;
      setSaveAvailability();
      updateSaveBanner();
      showStatus('Checklist exported to CSV');
    });
  }
  if (dismissSaveBtn) {
    dismissSaveBtn.addEventListener('click', () => {
      hasUnsavedExport = false;
      setSaveAvailability();
      updateSaveBanner();
      showStatus('Auto-save prompt dismissed');
    });
  }

  // banner was removed; native beforeunload remains in place

  // Drag & drop helpers
  function enableDragAndDrop() {
    const labels = Array.from(document.querySelectorAll('.section label'));
    labels.forEach(label => {
      if (label.draggable) return; // already attached
      label.draggable = true;
      attachDragHandlers(label);
    });

    const sections = Array.from(document.querySelectorAll('.section'));
    sections.forEach(section => {
      if (section.dataset.dropAttached === 'true') return;
      section.dataset.dropAttached = 'true';
      section.addEventListener('dragover', (e) => {
        e.preventDefault();
        section.classList.add('drag-over');
      });
      section.addEventListener('dragleave', () => {
        section.classList.remove('drag-over');
      });
      section.addEventListener('drop', (e) => {
        e.preventDefault();
        section.classList.remove('drag-over');
        if (!draggedLabel) return;
        // if dropped directly on the section (not on a label), append
        if (e.target === section || e.target === section.querySelector('.section-header')) {
          section.appendChild(draggedLabel);
          draggedLabel.dataset.lastUpdated = new Date().toISOString();
          sortDoneSection();
          saveState();
          updateCounter();
          applyCurrentFilter();
          showStatus('Item moved');
        }
      });
    });
  }

  function attachDragHandlers(label) {
    if (label.dataset.dragAttached === 'true') return;
    label.dataset.dragAttached = 'true';
    label.addEventListener('dragstart', (e) => {
      draggedLabel = label;
      label.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', ''); } catch (err) {}
      e.dataTransfer.effectAllowed = 'move';
      snapshotState();
    });

    label.addEventListener('dragend', () => {
      if (draggedLabel) {
        draggedLabel.classList.remove('dragging');
      }
      draggedLabel = null;
      // cleanup any drag-over visuals
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      saveState();
      updateCounter();
      applyCurrentFilter();
    });

    label.addEventListener('dragover', (e) => {
      e.preventDefault();
      const target = e.currentTarget;
      if (target === draggedLabel) return;
      target.classList.add('drag-over');
    });

    label.addEventListener('dragleave', (e) => {
      e.currentTarget.classList.remove('drag-over');
    });

    label.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = e.currentTarget;
      target.classList.remove('drag-over');
      if (!draggedLabel || draggedLabel === target) return;

      const rect = target.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      const parent = target.parentElement;
      if (after && target.nextSibling) {
        parent.insertBefore(draggedLabel, target.nextSibling);
      } else if (after) {
        parent.appendChild(draggedLabel);
      } else {
        parent.insertBefore(draggedLabel, target);
      }
      draggedLabel.dataset.lastUpdated = new Date().toISOString();
      sortDoneSection();
      saveState();
      updateCounter();
      applyCurrentFilter();
      showStatus('Item moved');
    });

  }

  function ensureSectionCounters() {
    document.querySelectorAll('.section-header').forEach(header => {
      if (header.querySelector('.section-counter')) return;
      const counter = document.createElement('span');
      counter.className = 'section-counter';
      counter.textContent = '0/0';
      header.appendChild(counter);
    });
  }

  function enableMobileAccordion() {
    const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
    document.querySelectorAll('.section-header').forEach(header => {
      if (header.dataset.accordionAttached === 'true') return;
      header.dataset.accordionAttached = 'true';
      header.addEventListener('click', (event) => {
        if (!isMobile()) return;
        const target = event.target;
        if (target.closest('button')) return;
        const section = header.closest('.section');
        if (!section) return;
        section.classList.toggle('collapsed');
      });
    });
  }

  window.addEventListener('beforeunload', (e) => {
      if (hasUnsavedExport) {
        e.preventDefault();
        e.returnValue = ''; // Chrome requires returnValue to be set
      }
    });
  } catch (err) {
    console.error('Startup error', err);
    const status = document.getElementById('statusMessage');
    if (status) {
      status.textContent = 'Startup error: ' + (err && err.message ? err.message : String(err));
      status.classList.add('visible', 'error');
    }
  }
});
